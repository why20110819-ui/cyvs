<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學生資料查詢｜啟英高中</title>
<style>
:root{--navy:#102a43;--blue:#1f6feb;--teal:#0f9d8a;--ink:#172b4d;--muted:#6b7c93;--line:#e5edf5;--bg:#f5f8fc;--card:#fff;--danger:#d64545;--shadow:0 18px 50px rgba(16,42,67,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
body:before{content:"";position:fixed;z-index:-1;inset:0 0 auto;height:330px;background:linear-gradient(135deg,#102a43 0%,#1f527a 58%,#268a88 100%);clip-path:ellipse(90% 66% at 50% 0)}
.shell{width:min(1120px,calc(100% - 32px));margin:0 auto}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);padding:42px 36px 34px;background:rgba(255,255,255,.98);border-radius:28px;box-shadow:0 25px 80px rgba(3,25,48,.25);animation:rise .45s ease-out}.brand-mark{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;margin:0 auto 18px;color:#fff;font-weight:900;font-size:25px;background:linear-gradient(145deg,#1f6feb,#0f9d8a);box-shadow:0 10px 25px rgba(31,111,235,.25)}h1,h2,h3,p{margin-top:0}.login-card h1{text-align:center;font-size:25px;letter-spacing:.04em;margin-bottom:8px}.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:30px}.field{margin-bottom:17px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px;color:#43556b}.field input{width:100%;padding:13px 14px;border:1px solid #d9e3ed;border-radius:13px;outline:none;color:var(--ink);background:#fbfdff;transition:.2s}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,111,235,.12)}.primary{width:100%;padding:14px;border-radius:13px;color:#fff;font-weight:800;background:linear-gradient(100deg,#1f6feb,#0f9d8a);box-shadow:0 10px 20px rgba(31,111,235,.18);transition:.2s}.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}.login-note{margin:20px 0 0;padding:12px 14px;border-radius:12px;background:#f1f7ff;color:#59718b;font-size:12px;line-height:1.6}.error{min-height:18px;color:var(--danger);font-size:13px;font-weight:700;margin:4px 0 13px}
.app{min-height:100vh;padding-bottom:44px}.topbar{padding:28px 0 26px;color:#fff}.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:18px}.mini-brand{display:flex;align-items:center;gap:12px}.mini-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);font-weight:900}.topbar h1{font-size:20px;margin:0}.topbar small{display:block;color:#cde6ef;margin-top:4px}.logout{padding:9px 13px;border-radius:10px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700}.content{margin-top:6px}.profile{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 24px;border:1px solid rgba(255,255,255,.7);border-radius:19px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);margin-bottom:23px}.profile-main{display:flex;align-items:center;gap:15px}.avatar{width:50px;height:50px;display:grid;place-items:center;border-radius:16px;background:#e6f4f3;color:var(--teal);font-weight:900;font-size:20px}.profile h2{font-size:18px;margin:0 0 4px}.profile p{font-size:13px;color:var(--muted);margin:0}.status{font-size:12px;font-weight:800;color:#14866e;background:#e7f8f2;padding:8px 11px;border-radius:999px}.dashboard-title{font-size:14px;color:#6b7c93;font-weight:800;letter-spacing:.08em;margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.feature{position:relative;overflow:hidden;text-align:left;padding:27px 26px;min-height:190px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(16,42,67,.07);transition:.25s}.feature:hover{transform:translateY(-4px);box-shadow:0 18px 35px rgba(16,42,67,.13);border-color:#bdd3e8}.feature:after{content:"";position:absolute;right:-35px;bottom:-42px;width:150px;height:150px;border-radius:50%;background:#edf5ff}.feature.teal:after{background:#e8f8f4}.icon{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;color:#fff;background:var(--blue);font-size:24px;margin-bottom:19px;position:relative;z-index:1}.teal .icon{background:var(--teal)}.feature h3{font-size:19px;margin-bottom:7px;position:relative;z-index:1}.feature p{color:var(--muted);font-size:13px;position:relative;z-index:1;margin-bottom:17px}.arrow{color:var(--blue);font-size:13px;font-weight:900;position:relative;z-index:1}.teal .arrow{color:var(--teal)}
.panel{padding-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:21px 0 17px}.panel-head h2{font-size:22px;margin:0}.back{padding:9px 13px;background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.metric{padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:16px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.metric strong{font-size:25px}.metric.blue strong{color:var(--blue)}.metric.green strong{color:var(--teal)}.metric.orange strong{color:#d28324}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.toolbar input{width:min(280px,100%);padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 25px rgba(16,42,67,.05)}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:15px 17px;border-bottom:1px solid #edf2f7;font-size:13px}th{background:#f8fbfe;color:#68809a;font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#edf4ff;color:#276ac4}.badge.good{background:#e7f8f2;color:#14866e}.badge.warn{background:#fff4df;color:#b06d13}.empty{text-align:center;color:var(--muted);padding:42px 20px!important}.footer{text-align:center;color:#8ba0b4;font-size:12px;margin-top:34px}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-width:650px){body:before{height:275px}.shell{width:min(100% - 22px,1120px)}.login-card{padding:34px 23px 26px}.topbar{padding-top:20px}.topbar h1{font-size:17px}.topbar small{font-size:11px}.profile{align-items:flex-start;padding:18px}.status{display:none}.cards{grid-template-columns:1fr}.feature{min-height:165px}.summary{grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:13px 10px}.metric span{font-size:11px}.metric strong{font-size:21px}.panel-head h2{font-size:20px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}}
</style>
</head>
<body>
<section id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand-mark">ST</div>
    <h1>學生資料查詢</h1>
    <p class="subtitle">請輸入學校提供的帳號與密碼<br>登入後即可查看個人資料</p>
    <form id="loginForm">
      <div class="field"><label for="username">帳號</label><input id="username" autocomplete="username" placeholder="請輸入帳號" required></div>
      <div class="field"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required></div>
      <div id="loginError" class="error" aria-live="polite"></div>
      <button class="primary" type="submit">登入查詢系統</button>
    </form>
    <div id="loginNote" class="login-note">資料載入中，請稍候…</div>
  </div>
</section>
<section id="app" class="app hidden">
  <header class="topbar"><div class="shell topbar-inner"><div class="mini-brand"><div class="mini-mark">ST</div><div><h1>學生資料查詢</h1><small>Student Information Portal</small></div></div><button id="logoutBtn" class="logout">登出</button></div></header>
  <main class="shell content">
    <section id="homeView">
      <div class="profile"><div class="profile-main"><div id="avatar" class="avatar">王</div><div><h2 id="studentName">學生</h2><p><span id="studentClass">—</span><span>　·　學號 <b id="studentId">—</b></span></p></div></div><div class="status">● 已登入</div></div>
      <p class="dashboard-title">查詢服務</p>
      <div class="cards"><button class="feature" data-view="rewards"><div class="icon">★</div><h3>獎懲查詢</h3><p>查看獎勵、懲處與相關事由紀錄。</p><span class="arrow">查看詳細資料　→</span></button><button class="feature teal" data-view="attendance"><div class="icon">✓</div><h3>出缺勤查詢</h3><p>查看出缺勤、遲到及請假紀錄。</p><span class="arrow">查看詳細資料　→</span></button></div>
    </section>
    <section id="rewardsView" class="panel hidden"><div class="panel-head"><h2>獎懲查詢</h2><button class="back">← 回到首頁</button></div><div class="summary"><div class="metric blue"><span>獎勵筆數</span><strong id="rewardCount">0</strong></div><div class="metric green"><span>嘉獎／小功</span><strong id="rewardPoints">0</strong></div><div class="metric orange"><span>懲處筆數</span><strong id="punishCount">0</strong></div></div><div class="toolbar"><span class="dashboard-title" style="margin:0">紀錄明細</span><input id="rewardSearch" placeholder="搜尋事由、類別或日期"></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>類別</th><th>事由</th><th>登錄單位</th></tr></thead><tbody id="rewardBody"></tbody></table></div></section>
    <section id="attendanceView" class="panel hidden"><div class="panel-head"><h2>出缺勤查詢</h2><button class="back">← 回到首頁</button></div><div class="summary"><div class="metric blue"><span>紀錄總數</span><strong id="attendanceCount">0</strong></div><div class="metric orange"><span>遲到次數</span><strong id="lateCount">0</strong></div><div class="metric green"><span>請假／缺席</span><strong id="leaveCount">0</strong></div></div><div class="toolbar"><span class="dashboard-title" style="margin:0">紀錄明細</span><input id="attendanceSearch" placeholder="搜尋日期、節次或狀態"></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>節次</th><th>狀態</th><th>分鐘</th><th>備註</th></tr></thead><tbody id="attendanceBody"></tbody></table></div></section>
    <p class="footer">資料僅供本人查詢，如發現內容有誤請洽學務處。</p>
  </main>
</section>
<script>
const API='/api/yaxin';let current=null,currentRecords={rewards:[],attendance:[]};const $=id=>document.getElementById(id);
const TARGET_URL='/SCH_UI/SSO/SIndex.aspx?AsParam=X0Z3UzJuJWU1JTg2JWE5JWU1JThhJWFiJWU3JThjJTlhJWU2JTg2JWIzZkxUVWtPVyUxN28lN2QlN2MlMGIlN2IlMDUlMDMlN2IlMDElMDIlMTZXV1o5dTIlM2MlMjc4MyUxNSVlNSVhZCU4OSVlNyU5NCVhYw==';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action,...extra})});const data=await r.json().catch(()=>({status:'error',message:'伺服器回傳格式錯誤'}));if(!r.ok||data.status==='error')throw new Error(data.message||'亞昕系統連線失敗');return data}
function setLoginError(message){$('loginError').textContent=message||''}
async function login(e){e.preventDefault();setLoginError('');const username=$('username').value.trim(),password=$('password').value;if(!username||!password){setLoginError('請輸入亞昕帳號與密碼。');return}const button=e.submitter||document.querySelector('#loginForm .primary');button.disabled=true;button.textContent='正在驗證亞昕帳密…';try{await api('login',{username,password});current={username};$('studentName').textContent=username;$('studentClass').textContent='亞昕系統已驗證';$('studentId').textContent=username;$('avatar').textContent=username.slice(0,1).toUpperCase();$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');showView('homeView')}catch(err){setLoginError(err.message)}finally{button.disabled=false;button.textContent='登入查詢系統'}}
function normalize(row,kind){const entries=Object.entries(row||{}),value=(tests)=>{const found=entries.find(([k,v])=>tests.some(t=>t.test(k))&&String(v).trim());return found?found[1]:''},all=entries.map(([,v])=>String(v||'')).join(' ');if(kind==='rewards')return{date:value([/日期|時間|date/i])||all.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/)?.[0]||'',type:value([/類別|項目|獎懲|種類|type/i]),reason:value([/事由|原因|說明|reason/i]),source:value([/單位|來源|登錄|source/i]),_raw:all};return{date:value([/日期|時間|date/i])||all.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/)?.[0]||'',period:value([/節|時段|period/i]),status:value([/狀態|假別|類別|出缺勤|status/i]),minutes:value([/分鐘|min/i]),remark:value([/備註|說明|remark/i]),_raw:all}}
async function query(kind){const body=kind==='rewards'?'rewardBody':'attendanceBody';$(body).innerHTML=`<tr><td colspan="${kind==='rewards'?4:5}" class="empty">正在從亞昕系統取得資料…</td></tr>`;try{const data=await api(kind,{targetUrl:TARGET_URL});currentRecords[kind]=(Array.isArray(data.records)?data.records:[]).map(x=>normalize(x,kind));kind==='rewards'?renderRewards():renderAttendance()}catch(err){$(body).innerHTML=`<tr><td colspan="${kind==='rewards'?4:5}" class="empty">${esc(err.message)}</td></tr>`}}
function renderRewards(){const rows=currentRecords.rewards||[],punish=rows.filter(x=>/懲|警告|處分/.test(x.type||x._raw));$('rewardCount').textContent=rows.length;$('punishCount').textContent=punish.length;$('rewardPoints').textContent=rows.length-punish.length;drawRewards(rows)}
function drawRewards(rows){$('rewardBody').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.date||'—')}</td><td><span class="badge ${/懲|警告|處分/.test(x.type||x._raw)?'warn':'good'}">${esc(x.type||'—')}</span></td><td>${esc(x.reason||x._raw||'—')}</td><td>${esc(x.source||'—')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">目前沒有獎懲紀錄</td></tr>'}
function renderAttendance(){const rows=currentRecords.attendance||[];$('attendanceCount').textContent=rows.length;$('lateCount').textContent=rows.filter(x=>/遲到/.test(x.status||x._raw)).length;$('leaveCount').textContent=rows.filter(x=>!/遲到/.test(x.status||x._raw)).length;drawAttendance(rows)}
function drawAttendance(rows){$('attendanceBody').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.date||'—')}</td><td>${esc(x.period||'—')}</td><td><span class="badge ${/遲到|曠課/.test(x.status||x._raw)?'warn':'good'}">${esc(x.status||'—')}</span></td><td>${esc(x.minutes||'—')}</td><td>${esc(x.remark||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">目前沒有出缺勤紀錄</td></tr>'}
function showView(id){['homeView','rewardsView','attendanceView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo({top:0,behavior:'smooth'})}
function filterRows(inputId,rows,draw){const q=$(inputId).value.trim().toLowerCase();draw(!q?rows:rows.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)))}
$('loginForm').addEventListener('submit',login);$('logoutBtn').addEventListener('click',async()=>{try{await api('logout')}finally{location.reload()}});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const kind=b.dataset.view;showView(kind+'View');query(kind)}));document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',()=>showView('homeView')));$('rewardSearch').addEventListener('input',()=>filterRows('rewardSearch',currentRecords.rewards||[],drawRewards));$('attendanceSearch').addEventListener('input',()=>filterRows('attendanceSearch',currentRecords.attendance||[],drawAttendance));$('loginNote').textContent='帳密會送至亞昕系統驗證，不會儲存在本網站。';
</script>
</body>
</html>
